{% extends "base.html" %}
{% block content %}
<div class="vnd-toolbar"><span class="vnd-toolbar-title"><i class="ti ti-key"></i> Change Password</span></div>
<div class="vnd-section" style="max-width:480px"><div class="vnd-section-head"><span class="sh-title"><i class="ti ti-lock"></i> Password</span></div>
<div class="vnd-section-body"><div class="fg2">
  <div class="f-group full"><label class="f-label">Current password</label><input class="f-input" type="password" id="cur" autocomplete="current-password"></div>
  <div class="f-group"><label class="f-label">New password <span class="hint">(8+ chars, letters & digits)</span></label><input class="f-input" type="password" id="new1" autocomplete="new-password"></div>
  <div class="f-group"><label class="f-label">Confirm</label><input class="f-input" type="password" id="new2" autocomplete="new-password"></div></div>
  <button class="m-btn m-btn--save" id="go" style="margin-top:.5rem"><i class="ti ti-device-floppy"></i> Change password</button></div></div>
{% endblock %}
{% block scripts %}<script>
ERP.$('#go').onclick = async () => {
  const a = ERP.$('#new1').value, b = ERP.$('#new2').value;
  if (a !== b) return ERP.toast('Passwords do not match', 'err');
  try { await ERP.post('/api/auth/change-password', { current_password: ERP.$('#cur').value, new_password: a }); ERP.toast('Password changed'); setTimeout(() => location.href = '/', 900); }
  catch (e) { ERP.errToast(e); }
};
</script>{% endblock %}
