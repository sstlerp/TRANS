<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ app_name }}</title>
<link rel="stylesheet" href="/static/vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/erp.css"></head>
<body>
<header class="brand--login">
  <span class="bi-logo"><i class="ti ti-truck-delivery"></i></span>
  <span class="bi-name"><b style="font-size:1.25rem">{{ app_name }}</b><small>{{ brand_company_name }}</small></span>
</header>
<div class="login-shell"><div class="login-card">
  <h1>Sign in</h1>
  <p class="lead">Enter your username and password.</p>
  <form method="post" action="/login" autocomplete="on">
    {% if error %}<div class="note note-err"><i class="ti ti-alert-circle"></i><div>{{ error }}</div></div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="u">Username</label><input class="input" id="u" name="username" required autofocus autocomplete="username">
    <label for="p">Password</label><input class="input" id="p" type="password" name="password" required autocomplete="current-password">
    <button class="login-btn"><i class="ti ti-login"></i> Sign in</button>
  </form>
  <div class="login-foot">{{ today }}</div>
</div></div>
</body></html>
