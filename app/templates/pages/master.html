{% extends "base.html" %}
{% block title %}{{ spec.title }} · {{ brand_company_name }}{% endblock %}
{% block content %}
<div class="vnd-page" id="master-page" data-key="{{ spec.key }}">
  <div class="vnd-toolbar">
    <div class="vnd-tb-left"><span class="vnd-toolbar-title"><i class="ti {{ spec.icon }}" style="margin-right:.3rem"></i> {{ spec.title }}</span>
      <span class="vnd-mode-badge">{{ spec.group }}</span></div>
    <div class="vnd-tb-right" id="tb-right"></div>
  </div>
  <div class="vnd-body">
    <div id="page-desc"></div>
    <div class="vsb-bar" id="vsb">
      <div class="vsb-bar-header">
        <div class="vsb-header-left"><span class="vsb-bar-badge" id="vsb-mode">VIEW</span><span class="vsb-bar-id" id="vsb-id"></span><span id="vsb-status"></span></div>
        <div class="vsb-bar-name-wrap"><span class="vsb-bar-name" id="vsb-name"></span><span class="vsb-bar-sub" id="vsb-sub"></span></div>
        <div class="vsb-header-right"><span id="vsb-actions"></span>
          <button class="vsb-bar-toggle" title="Expand / collapse" onclick="document.getElementById('vsb-details').classList.toggle('collapsed')"><i class="ti ti-chevron-down"></i></button>
          <button class="vsb-bar-close" title="Close" onclick="document.getElementById('btn-cancel').click()">&#215;</button></div>
      </div>
      <div class="vsb-bar-details collapsed" id="vsb-details"></div>
      <div class="vsb-wss-strip" id="vsb-strip" style="display:none"></div>
    </div>
    <div class="vnd-form-wrap" id="form-wrap" style="display:none"></div>
    <div class="vnd-list-wrap" id="list-wrap"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/master.js"></script>
{% if spec.key == 'vehicles' %}<script src="/static/js/vehicle_ext.js"></script>{% endif %}
<script>Master.init({{ spec.key|tojson }});</script>
{% endblock %}
